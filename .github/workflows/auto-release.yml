name: Automatic Release

on:
  workflow_run:
    workflows: ["ci"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: automatic-release-${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.ref }}
  cancel-in-progress: true

jobs:
  release:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout validated Protocol commit
        uses: actions/checkout@3d3c42eb24a2078cb907f02df7e1e7fc2bf0aa8e # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.ref }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'
      - name: Validate and publish immutable release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          git fetch --force --tags origin
          git fetch --no-tags origin main
          head="$(git rev-parse HEAD)"
          main_head="$(git rev-parse origin/main)"
          if [[ "$GITHUB_EVENT_NAME" == "workflow_run" && "$head" != "$main_head" ]]; then
            echo "Validated SHA $head is stale versus main $main_head; skipping."
            exit 0
          fi
          current="$(python - <<'PY'
          import json, re, tomllib
          from pathlib import Path
          cargo = tomllib.loads(Path("Cargo.toml").read_text())["package"]["version"]
          py = tomllib.loads(Path("sdk/python/pyproject.toml").read_text())["project"]["version"]
          node = json.loads(Path("package.json").read_text())["version"]
          pkg_lock = json.loads(Path("package-lock.json").read_text())
          lock_pkg = pkg_lock.get("version")
          lock_root = pkg_lock.get("packages", {}).get("", {}).get("version")
          lock = Path("Cargo.lock").read_text()
          m = re.search(r'(?ms)^name = "kitt-protocol"\nversion = "([^"]+)"', lock)
          if not m: raise SystemExit("kitt-protocol missing from Cargo.lock")
          values = {"cargo": cargo, "python": py, "node": node, "pkg_lock": lock_pkg, "pkg_lock_root": lock_root, "lock": m.group(1)}
          if len(set(values.values())) != 1: raise SystemExit(f"version mismatch: {values}")
          if not re.fullmatch(r"\d+\.\d+\.\d+", cargo): raise SystemExit(f"invalid semver: {cargo}")
          print(cargo)
          PY
          )"
          tag="v$current"
          tagged="$(git rev-list -n1 "$tag" 2>/dev/null || true)"
          if [[ -n "$tagged" && "$tagged" != "$head" ]]; then
            if ! git merge-base --is-ancestor "$tagged" "$head"; then
              echo "Immutable tag $tag at $tagged is not an ancestor of validated main $head." >&2
              exit 1
            fi
            publishable=()
            while IFS= read -r path; do
              case "$path" in
                .github/*|docs/*|tests/*|*/tests/*|README.md|CHANGELOG.md|README.pt-BR.md|LICENSE|SECURITY.md) ;;
                *) publishable+=("$path") ;;
              esac
            done < <(git diff --name-only "$tagged..$head")
            if (( ${#publishable[@]} )); then
              printf 'Same-version main contains publishable changes that require a version bump:\n' >&2
              printf '  %s\n' "${publishable[@]}" >&2
              exit 1
            fi
            echo "Validated main differs from $tag only in tests/docs/workflows; no package release is required."
            exit 0
          fi
          if [[ -z "$tagged" ]]; then
            gh api --method POST "repos/${GITHUB_REPOSITORY}/git/refs" -f ref="refs/tags/$tag" -f sha="$head" >/dev/null
          fi
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release $tag already exists."
          else
            gh release create "$tag" --target "$head" --title "$tag" --generate-notes
          fi
