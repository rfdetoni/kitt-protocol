name: ci
on:
  push:
    branches: [main] # Release automation consumes the successful main CI
    paths-ignore: ['**/*.md', 'docs/**']
  pull_request:
    branches: [main]
    paths-ignore: ['**/*.md', 'docs/**']
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42eb24a2078cb907f02df7e1e7fc2bf0aa8e # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with: { components: rustfmt,clippy }
      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          cache-bin: 'false'
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test

  sdks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42eb24a2078cb907f02df7e1e7fc2bf0aa8e # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with: { python-version: '3.14' }
      - name: Check generated Agent response schema
        run: python scripts/export_agent_contract.py --check
      - name: Check generated Context envelope schema
        run: python scripts/export_context_schema.py --check
      - name: Verify cross-SDK contract parity
        run: python scripts/check_contract_parity.py
      - run: PYTHONPATH=sdk/python python -m unittest discover sdk/python/tests
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: { node-version: '24', cache: 'npm' }
      - run: npm ci
      - run: npm test
      - name: KAP/2 Python ↔ TS differential fuzz (5000 seeded cases)
        run: python scripts/fuzz_kap2_diff.py
