name: ci
on:
  push:
    branches: [main] # Release automation consumes the successful main CI
    paths-ignore: ['**/*.md', 'docs/**']
  pull_request:
    branches: [main]
    paths-ignore: ['**/*.md', 'docs/**']
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with: { components: rustfmt,clippy }
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test

  sdks:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: { python-version: '3.14' }
      - name: Check generated Agent response schema
        run: python scripts/export_agent_contract.py --check
      - name: Verify cross-SDK contract parity
        run: python scripts/check_contract_parity.py
      - run: PYTHONPATH=sdk/python python -m unittest discover sdk/python/tests
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: { node-version: '22', cache: 'npm' }
      - run: npm ci
      - run: npm test
      - name: KAP/2 Python ↔ TS differential fuzz (5000 seeded cases)
        run: python scripts/fuzz_kap2_diff.py
